<!DOCTYPE html>

<title>The Realm</title>
<style>html,body{touch-action:none;-webkit-user-select:none;user-select:none;background:#0b1020;width:100%;height:100%;margin:0;padding:0;font-family:Georgia,serif;overflow:hidden}#app{position:fixed;inset:0}canvas{image-rendering:pixelated;display:block}#start{color:#f3ecd8;z-index:20;text-align:center;cursor:pointer;background:radial-gradient(at 50% 35%,#5e9a932e,#0508129e 72%);flex-direction:column;justify-content:center;align-items:center;transition:opacity .8s;display:flex;position:fixed;inset:0}#start h1{letter-spacing:.14em;margin:0;font-size:clamp(42px,9vw,84px);font-weight:400}#start p{opacity:.85;letter-spacing:.08em;margin:14px 20px 0;font-size:clamp(13px,2.4vw,17px);line-height:1.7}#start .hint{letter-spacing:.22em;text-transform:uppercase;opacity:.6;margin-top:26px;font-size:12px;animation:2s infinite pulse}@keyframes pulse{0%,to{opacity:.35}50%{opacity:.75}}#fade{opacity:0;pointer-events:none;z-index:15;background:#000;transition:opacity .5s;position:fixed;inset:0}#vignette{pointer-events:none;z-index:5;background:radial-gradient(#0000 66%,#0000002e 100%);position:fixed;inset:0}#joy{z-index:10;background:#ffffff12;border:1.5px solid #ffffff59;border-radius:50%;width:118px;height:118px;display:none;position:fixed;bottom:26px;left:22px}#joyKnob{background:#ffffff59;border-radius:50%;width:52px;height:52px;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}#btns{z-index:10;flex-direction:column;gap:12px;display:none;position:fixed;bottom:30px;right:20px}.mbtn{color:#fff;letter-spacing:.05em;background:#ffffff1a;border:1.5px solid #ffffff59;border-radius:50%;width:58px;height:58px;font-family:Georgia,serif;font-size:13px}.mbtn:active{background:#ffffff4d}#castTip{color:#ffe9b0;letter-spacing:.12em;z-index:9;opacity:0;text-shadow:0 1px 8px #000;pointer-events:none;font-size:14px;transition:opacity .4s;position:fixed;bottom:9%;left:50%;transform:translate(-50%)}@media (pointer:coarse){#joy{display:block}#btns{display:flex}}</style>
